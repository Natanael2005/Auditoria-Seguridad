<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Auditoría</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
        .navbar { background-color: #1e1e2f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: #ff4d4d; text-decoration: none; font-weight: bold; }
        .container { display: flex; padding: 20px; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 50%; }
        h3 { border-bottom: 2px solid #4CAF50; padding-bottom: 10px; margin-top: 0; }
    </style>
</head>
<body>

    <div class="navbar">
        <div>Auditoría de Seguridad - Usuario: <strong>{{ usuario }}</strong></div>
        <a href="/logout">Cerrar Sesión</a>
    </div>

    <div class="container">
        <div class="panel">
            <h3>🔍 Herramienta de Footprinting (Diego)</h3>
            <p>Aquí Diego colocará su formulario para buscar dominios e IPs.</p>
        </div>

        <div class="panel">
            <h3>🛡️ Auditoría: Logs de Aplicación (Nata)</h3>
            <p>Aquí mostraremos la tabla de Supabase en tiempo real.</p>
        </div>
    </div>

</body>
</html>
