<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Leona Corporation</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1e1e2f; color: #ffffff; margin: 0; }
        .login-box { background: #2a2a40; padding: 2.5rem; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 350px; }
        .logo { width: 120px; border-radius: 10px; margin-bottom: 15px; }
        h2 { margin-top: 0; color: #4CAF50; }
        input { display: block; width: 100%; margin: 15px 0; padding: 12px; box-sizing: border-box; border: 1px solid #444; border-radius: 5px; background-color: #1e1e2f; color: white; }
        button { background-color: #0b2545; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #13315c; }
        .btn-registro { background-color: #4CAF50; margin-top: 10px; }
        .btn-registro:hover { background-color: #45a049; }
        .error-msg { color: #ff4d4d; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='LeonaCorporations.png') }}" alt="Logo Leona Corp" class="logo">
        
        <h2>Portal Interno</h2>
        <p style="font-size: 14px; color: #aaa;">Acceso exclusivo para empleados</p>
        
        <form method="POST" action="/">
            <input type="email" name="email" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar Sesión</button>
        </form>
        
        <a href="/register" style="text-decoration: none;">
            <button class="btn-registro">Crear cuenta de empleado</button>
        </a>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
