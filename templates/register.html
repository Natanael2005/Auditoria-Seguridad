<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Leona Corp</title>
    <style>
        /* Usa exactamente los mismos estilos CSS que tienes en tu login.html para que se vea igual */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1e1e2f; color: #ffffff; margin: 0; }
        .login-box { background: #2a2a40; padding: 2.5rem; border-radius: 10px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 350px; }
        h2 { margin-top: 0; color: #4CAF50; }
        input { display: block; width: 100%; margin: 15px 0; padding: 12px; box-sizing: border-box; border: 1px solid #444; border-radius: 5px; background-color: #1e1e2f; color: white; }
        button { background-color: #4CAF50; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background-color: #45a049; }
        .error-msg { color: #ff4d4d; margin-top: 10px; font-size: 14px; }
        .success-msg { color: #4CAF50; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Alta de Empleado</h2>
        <p style="font-size: 14px; color: #aaa;">Generar credenciales de prueba</p>
        <form method="POST" action="/register">
            <input type="email" name="email" placeholder="Correo electrónico inventado" required>
            <input type="password" name="password" placeholder="Contraseña (mínimo 6 letras)" required>
            <button type="submit">Registrar Empleado</button>
            <a href="/" style="color: #aaa; display: block; margin-top: 15px; text-decoration: none; font-size: 14px;">Volver al Login</a>
        </form>
        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
        {% if success %}<div class="success-msg">{{ success }}</div>{% endif %}
    </div>
</body>
</html>
